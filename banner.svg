<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KOKUEN design operating system</title>
  <desc id="desc">A sparse graphite banner describing KOKUEN's shared interface contracts.</desc>

  <rect width="1200" height="520" fill="#0a0a0a"/>

  <g fill="#e8e6e3" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="78" font-size="18" font-weight="650" letter-spacing="1.5">KOKUEN</text>
    <text x="58" y="300" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="188" font-weight="700">黒鉛</text>
    <text x="68" y="370" font-size="34" font-weight="450" letter-spacing="10">kokuen</text>

    <text x="672" y="148" font-size="48" font-weight="650" letter-spacing="-1.8">Design operating</text>
    <text x="672" y="204" font-size="48" font-weight="650" letter-spacing="-1.8">system.</text>
    <text x="675" y="260" fill="#a8a8a4" font-size="21" font-weight="400">Shared behavior. Product-owned character.</text>

    <text x="675" y="332" font-size="17" font-weight="600">44px targets</text>
    <text x="675" y="368" font-size="17" font-weight="600">one control, one boundary</text>
    <text x="675" y="404" font-size="17" font-weight="600">complete keyboard and focus models</text>
    <text x="675" y="440" font-size="17" font-weight="600">rendered proof before completion</text>
  </g>

  <g stroke="#6e6e6e" stroke-width="2" stroke-linecap="round">
    <path d="M64 452H576"/>
    <path d="M64 444V460M128 448V456M192 448V456M256 444V460M320 448V456M384 448V456M448 444V460M512 448V456M576 444V460"/>
  </g>
  <text x="64" y="490" fill="#a8a8a4" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14">0 · 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64</text>
</svg>
